[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelchain"
version = "1.0.0"
description = "An Agentic Supply Chain Risk & Compliance Engine"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.10.0",
    "pydantic-settings==2.6.0",
    "python-dotenv==1.0.1",
    "langgraph>=0.2.50,<0.3",
    "langchain-core>=0.3.33,<1",
    "langchain-anthropic>=0.3.5",
    "langsmith>=0.1.134",
    "crewai==0.80.0",
    "anthropic==0.45.0",
    "openai==1.54.0",
    "boto3==1.35.0",
    "tavily-python==0.5.0",
    "exa-py==1.1.2",
    "apify-client==1.4.0",
    "e2b-code-interpreter==1.0.0",
    "mcp==1.0.0",
    "pinecone==5.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "redis==5.2.0",
    "sentence-transformers==3.2.0",
    "unstructured==0.16.0",
    "unstructured-inference==0.11.0",
    "pypdf==4.2.0",
    "python-docx==1.1.0",
    "guardrails-ai==0.6.0",
    "presidio-analyzer==2.2.355",
    "presidio-anonymizer==2.2.355",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "wandb==0.17.0",
    "weave==0.49.0",
    "httpx==0.27.0",
    "tenacity==8.5.0",
    "python-json-logger==2.0.7",
    "structlog==24.1.0",
    "prometheus-client==0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.23.0",
    "pytest-mock==3.14.0",
    "black==24.8.0",
    "ruff==0.6.0",
    "mypy==1.11.0",
    "pre-commit==3.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinelchain*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "PIE", "T20", "TCH", "TRY", "PD", "RUF", "RET", "ARG", "PTH", "ERA", "PL", "PT", "NPY"]
ignore = ["E501", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.coverage.run]
source = ["sentinelchain"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError"]