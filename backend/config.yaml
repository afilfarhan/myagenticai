# SentinelChain Configuration
app:
  name: "SentinelChain"
  version: "1.0.0"
  environment: "development"
  debug: true
  host: "0.0.0.0"
  port: 8000

# Allowed CORS origins (frontend dev server / production origins)
cors_origins:
  - "http://localhost:3000"
  - "http://127.0.0.1:3000"

# LLM Configuration
llm:
  primary:
    provider: "anthropic"
    model: "claude-3-5-sonnet-20241022"
    api_key: "${ANTHROPIC_API_KEY}"
    temperature: 0.1
    max_tokens: 8192
  multimodal:
    provider: "openai"
    model: "gpt-4o"
    api_key: "${OPENAI_API_KEY}"
    temperature: 0.1
    max_tokens: 4096
  secure:
    provider: "bedrock"
    model: "meta.llama3-1-70b-instruct-v1:0"
    region: "us-east-1"
    temperature: 0.1
    max_tokens: 4096

# LangGraph Configuration
langgraph:
  recursion_limit: 10
  checkpoint_interval: 5
  state_ttl: 3600

# CrewAI Configuration (deep-dive engine; requires Python >=3.11,<3.13)
# When enabled, deep-dive investigations run via the CrewAI crew with an
# automatic fallback to the LangGraph pipeline on failure.
crewai:
  enabled: false
  verbose: true
  max_iter: 10
  max_rpm: 100

# Tool Configuration
tools:
  tavily:
    api_key: "${TAVILY_API_KEY}"
    max_results: 10
    search_depth: "advanced"
  exa:
    api_key: "${EXA_API_KEY}"
    max_results: 10
  apify:
    api_token: "${APIFY_API_TOKEN}"
    timeout: 300
  e2b:
    api_key: "${E2B_API_KEY}"
    timeout: 120

# Memory Configuration
memory:
  pinecone:
    api_key: "${PINECONE_API_KEY}"
    index_name: "sentinelchain-suppliers"
    environment: "us-east-1"
    dimension: 1536
    metric: "cosine"
  redis:
    url: "${REDIS_URL}"
    max_connections: 50
    socket_timeout: 5
    socket_connect_timeout: 5
  embeddings:
    provider: "sentence_transformers"
    model: "all-MiniLM-L6-v2"
    dimension: 384

# Security Configuration
security:
  presidio:
    enabled: true
    language: "en"
    entities_to_mask:
      - "PERSON"
      - "LOCATION"
      - "ORGANIZATION"
      - "EMAIL_ADDRESS"
      - "PHONE_NUMBER"
      - "CREDIT_CARD"
      - "IBAN_CODE"
      - "IP_ADDRESS"
  guardrails:
    enabled: true
    validation_strict: true
  prompt_injection:
    enabled: true
    threshold: 0.8

# Observability Configuration
observability:
  langsmith:
    api_key: "${LANGSMITH_API_KEY}"
    project: "sentinelchain"
    enabled: true
  wandb:
    api_key: "${WANDB_API_KEY}"
    project: "sentinelchain"
    entity: "${WANDB_ENTITY}"
    enabled: true
  prometheus:
    enabled: true
    port: 9090

# Cost Control
cost_control:
  semantic_cache:
    enabled: true
    similarity_threshold: 0.95
    max_entries: 10000
  monthly_budget_usd: 1000
  cost_per_supplier_target: 0.50

# HITL Configuration
hitl:
  slack:
    webhook_url: "${SLACK_WEBHOOK_URL}"
    channel: "#supply-chain-alerts"
    timeout_seconds: 300
  approval_required_for:
    - "SEVERE"
    - "CRITICAL"

# Auth Configuration
auth:
  jwt_secret: "${JWT_SECRET_KEY}"
  access_token_ttl_min: 15
  refresh_token_ttl_days: 7

# Database (for supplier data)
database:
  url: "${DATABASE_URL}"
  pool_size: 10
  max_overflow: 20